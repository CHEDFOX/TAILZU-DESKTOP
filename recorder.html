<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Scripts from this app's own files only (hence recorder.js rather than
         an inline script), and connections only to a backend over https/wss,
         or to one on this machine for a dev run (main.js refuses any other). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*" />
    <title>Tailzu recorder</title>
  </head>
  <body>
    <script src="knobs.js"></script>
    <script src="speechMeter.js"></script>
    <script src="recorder.js"></script>
  </body>
</html>

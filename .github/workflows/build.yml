name: build

# Builds the desktop installers on GitHub's runners — including the macOS .dmg,
# which can ONLY be built on a Mac (electron-builder can't cross-build it).
#
# AND PUBLISHES THEM, but only when asked. With the DOWNLOADS_SSH_KEY secret
# set, a manual run ("Run workflow" on the Actions tab) sends each installer
# straight to ~/tulmi/downloads on the server, where /download serves it
# (stable filenames, no link changes) and every older install is offered the
# update in its window. The key is pinned on the server to
# deploy/receive-download.sh (TAILZU-BACKEND), so all it can do is drop one of
# the three installer files.
#
# A push only builds and keeps the installers as artifacts on the run page.
# Publishing reaches every user, so it is never a side effect of a push — in
# this repo main is where the code lives, and a push there is not a release.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Build and publish one platform, or all"
        type: choice
        options: [all, mac, win, linux]
        default: all

jobs:
  mac:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'mac' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The focused-field reader's AppleScript, which no Linux machine can
      # check: it must at least compile against System Events.
      - name: Check the field reader
        run: node nativeCheck.js mac
      - name: Build .dmg
        env:
          # SIGNED AND NOTARIZED when the Apple secrets are set, so macOS opens
          # it without "cannot be verified". Unsigned (as before) when they are
          # not, so a fork or a missing secret still builds.
          #   MAC_CERT_P12_BASE64  the Developer ID Application certificate,
          #                        exported from Keychain as .p12, base64'd
          #   MAC_CERT_PASSWORD    the password set on that export
          #   APPLE_API_KEY_P8     an App Store Connect API key (.p8 contents)
          #   APPLE_API_KEY_ID     its Key ID
          #   APPLE_API_ISSUER     the Issuer ID on the same page
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No MAC_CERT_P12_BASE64 secret: building an UNSIGNED dmg (macOS will say it cannot be verified)."
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          else
            # Signing without notarizing still trips Gatekeeper; say so.
            [ -n "$CSC_LINK" ] && echo "::warning::Signed but NOT notarized: add APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER."
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          unset APPLE_API_KEY_P8
          if [ -n "$CSC_LINK" ]; then
            # OUR OWN KEYCHAIN, NOT ELECTRON-BUILDER'S. Given CSC_LINK,
            # electron-builder 24 makes a keychain with a random password and
            # then runs set-key-partition-list with the .p12 password instead,
            # which macOS 15+ refuses ("SecKeychainUnlock: The user name or
            # passphrase you entered is not correct"). Importing it here and
            # pointing CSC_KEYCHAIN at it skips that step entirely.
            KEYCHAIN="$RUNNER_TEMP/tailzu-signing.keychain-db"
            KC_PASS=$(openssl rand -base64 24)
            security create-keychain -p "$KC_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
            printf '%s' "$CSC_LINK" | base64 -D > "$RUNNER_TEMP/devid.p12"
            security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/devid.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$KEYCHAIN"
            export CSC_KEYCHAIN="$KEYCHAIN"
            unset CSC_LINK CSC_KEY_PASSWORD KC_PASS
          fi
          npm ci
          npm run icon
          # The note-taker's helper that hears the computer's sound
          # (audiotap/main.swift), built for both Mac architectures.
          npm run audiotap
          # The on-device OCR helper (native/tzocr.swift, macOS Vision), same.
          npm run tzocr
          # --publish never: at a repo root on CI, electron-builder infers a
          # GitHub release and demands GH_TOKEN. Publishing is the step below.
          # --universal: macos-latest runners are arm64; a plain build would ship
          # an arm64-only dmg that Intel Macs can't open. Universal lipo-merges
          # both arches (per-arch .node prebuilds allowed via mac.x64ArchFiles).
          npx electron-builder --mac --universal --publish never
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Check what macOS will think of it
        run: |
          APP=$(find dist -maxdepth 3 -name "Tailzu.app" -type d | head -1)
          if codesign --verify --deep --strict "$APP" 2>/dev/null; then
            codesign -dv "$APP" 2>&1 | grep -E "Authority=Developer ID|TeamIdentifier" || true
            spctl -a -vvv -t exec "$APP" 2>&1 || echo "::warning::Gatekeeper does not accept it yet (not notarized?)"
          else
            echo "::warning::Tailzu.app is not signed."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Tailzu-mac
          path: dist/Tailzu.dmg
          if-no-files-found: error
      - name: Publish to tailzu.space
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          KEY: ${{ secrets.DOWNLOADS_SSH_KEY }}
          HOST: ${{ vars.DOWNLOADS_HOST || '91.108.104.168' }}
        run: |
          if [ -z "$KEY" ]; then echo "No DOWNLOADS_SSH_KEY secret: kept as an artifact only."; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/tailzu_ci
          chmod 600 ~/.ssh/tailzu_ci
          # Best effort: Git Bash's ssh-keyscan on the Windows runner can fail
          # where ssh itself works, and a failed scan must not stop the upload.
          ssh-keyscan -T 20 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "keyscan failed; ssh accepts the key on first use"
          # The version rides with the name; the server writes it beside the
          # installer and tells every older install, in its window. A receiver
          # from before versions refuses the pair (exit 2): send the name alone.
          V=$(node -p "require('./package.json').version")
          up() { ssh -i "$HOME/.ssh/tailzu_ci" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "root@$HOST" "$1" < dist/Tailzu.dmg; }
          up "Tailzu.dmg $V" || { rc=$?; if [ "$rc" -eq 2 ]; then up "Tailzu.dmg"; else exit "$rc"; fi; }
          rm -f ~/.ssh/tailzu_ci

  win:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'win' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The PowerShell that names the app and reads the focused field (UI
      # Automation), run for real: one answer to each question, in order.
      - name: Check the field reader
        run: node nativeCheck.js win
      - name: Build installer
        run: |
          npm ci
          npm run icon
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Tailzu-win
          path: dist/Tailzu-Setup.exe
          if-no-files-found: error
      # THE FREE WAY PAST SMARTSCREEN: the Microsoft Store. A Store package is
      # signed by Microsoft, so it installs with no "Windows protected your
      # PC" and needs no certificate of ours. Built only once the app is
      # reserved in Partner Center and its identity is saved as repository
      # VARIABLES (Settings > Secrets and variables > Actions > Variables),
      # copied from Partner Center > the app > Product identity:
      #   MSSTORE_IDENTITY_NAME   Package/Identity/Name
      #   MSSTORE_PUBLISHER       Package/Identity/Publisher (CN=…)
      #   MSSTORE_PUBLISHER_NAME  Package/Properties/PublisherDisplayName
      # The .appx is kept on the run page, to upload in Partner Center.
      - name: Build Microsoft Store package
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' && vars.MSSTORE_PUBLISHER != '' }}
        shell: bash
        env:
          ID: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUB: ${{ vars.MSSTORE_PUBLISHER }}
          PUBNAME: ${{ vars.MSSTORE_PUBLISHER_NAME }}
        run: |
          npx electron-builder --win appx --publish never \
            -c.appx.identityName="$ID" -c.appx.publisher="$PUB" \
            -c.appx.publisherDisplayName="${PUBNAME:-Tailzu}"
      - uses: actions/upload-artifact@v4
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' && vars.MSSTORE_PUBLISHER != '' }}
        with:
          name: Tailzu-store
          path: dist/Tailzu.appx
          if-no-files-found: error
      - name: Publish to tailzu.space
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          KEY: ${{ secrets.DOWNLOADS_SSH_KEY }}
          HOST: ${{ vars.DOWNLOADS_HOST || '91.108.104.168' }}
        run: |
          if [ -z "$KEY" ]; then echo "No DOWNLOADS_SSH_KEY secret: kept as an artifact only."; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/tailzu_ci
          chmod 600 ~/.ssh/tailzu_ci
          # Best effort: Git Bash's ssh-keyscan on the Windows runner can fail
          # where ssh itself works, and a failed scan must not stop the upload.
          ssh-keyscan -T 20 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "keyscan failed; ssh accepts the key on first use"
          # The version rides with the name; the server writes it beside the
          # installer and tells every older install, in its window. A receiver
          # from before versions refuses the pair (exit 2): send the name alone.
          V=$(node -p "require('./package.json').version")
          up() { ssh -i "$HOME/.ssh/tailzu_ci" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "root@$HOST" "$1" < dist/Tailzu-Setup.exe; }
          up "Tailzu-Setup.exe $V" || { rc=$?; if [ "$rc" -eq 2 ]; then up "Tailzu-Setup.exe"; else exit "$rc"; fi; }
          rm -f ~/.ssh/tailzu_ci

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build AppImage
        run: |
          npm ci
          npm run icon
          npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Tailzu-linux
          path: dist/Tailzu.AppImage
          if-no-files-found: error
      - name: Publish to tailzu.space
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          KEY: ${{ secrets.DOWNLOADS_SSH_KEY }}
          HOST: ${{ vars.DOWNLOADS_HOST || '91.108.104.168' }}
        run: |
          if [ -z "$KEY" ]; then echo "No DOWNLOADS_SSH_KEY secret: kept as an artifact only."; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/tailzu_ci
          chmod 600 ~/.ssh/tailzu_ci
          # Best effort: Git Bash's ssh-keyscan on the Windows runner can fail
          # where ssh itself works, and a failed scan must not stop the upload.
          ssh-keyscan -T 20 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "keyscan failed; ssh accepts the key on first use"
          # The version rides with the name; the server writes it beside the
          # installer and tells every older install, in its window. A receiver
          # from before versions refuses the pair (exit 2): send the name alone.
          V=$(node -p "require('./package.json').version")
          up() { ssh -i "$HOME/.ssh/tailzu_ci" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "root@$HOST" "$1" < dist/Tailzu.AppImage; }
          up "Tailzu.AppImage $V" || { rc=$?; if [ "$rc" -eq 2 ]; then up "Tailzu.AppImage"; else exit "$rc"; fi; }
          rm -f ~/.ssh/tailzu_ci

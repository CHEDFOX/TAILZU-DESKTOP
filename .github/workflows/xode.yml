name: xode

# Xode in the terminal (cli/, the npm package @xooteqlab/xode): tested on every push that touches it, and PUBLISHED to npm
# only on a manual run ("Run workflow" on the Actions tab), like the desktop installers.
#
# Publishing uses npm's trusted publishing: npm trusts this workflow, in this repository, by GitHub's own short-lived
# identity (id-token), so no npm token or one-time code is stored anywhere. Set once on npmjs.com: the package →
# Settings → Trusted publishing → GitHub Actions, owner CHEDFOX, repository TAILZU-DESKTOP, workflow xode.yml.
#
# A release is a version raised in cli/package.json (npm version patch, committed), then a manual run. A run whose
# version is already on npm publishes nothing and says so.

on:
  push:
    paths: ["cli/**", "src/runner/**", ".github/workflows/xode.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: cli
        env:
          XODE_NO_UPDATE_CHECK: "1"
        run: npm test

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Publish, unless this version is already out
        working-directory: cli
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: raise the version in cli/package.json (npm version patch) and run again."
            exit 0
          fi
          npm publish --access public

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Nothing runs but this app's own files (so the script is overlay.js),
         and nothing is fetched. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'" />
    <title>Tailzu captions</title>
    <!-- The guide's card, as a strip: the same ink, the same pale, the one
         amber for the open microphone, the same type (guide.html). Every
         number and colour below is also a knob (desktop.overlay.*), applied
         by the script at the bottom; these are the first frame's. -->
    <style>
      @font-face { font-family:"Instrument Sans"; font-weight:500; src:url(assets/fonts/instrument-sans-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family:"Newsreader"; font-weight:400; font-style:italic; src:url(assets/fonts/newsreader-latin-400-italic.woff2) format("woff2"); }
      @font-face { font-family:"IBM Plex Mono"; font-weight:500; src:url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family:"Noto Sans Devanagari"; font-weight:100 900; src:url(assets/fonts/noto-sans-devanagari-devanagari-400-normal.woff2) format("woff2"); unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF; }
      html, body { margin: 0; background: transparent; overflow: hidden; }
      #box {
        position: relative;
        box-sizing: border-box;
        margin: 8px;
        padding: 12px 18px;
        min-height: 44px;
        max-height: 64px;
        border-radius: 16px;
        background: #151210;
        color: #F3E2C6;
        font: 500 15px/1.4 "Instrument Sans", "Noto Sans Devanagari", -apple-system, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        gap: 12px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(243, 226, 198, 0.12), 0 18px 40px -12px rgba(0, 0, 0, 0.5), 0 3px 10px rgba(0, 0, 0, 0.25);
      }
      /* The guide's paper: dots too faint to read as anything else. */
      #box::before {
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background-image: radial-gradient(rgba(243, 226, 198, 0.07) .7px, transparent .9px);
        background-size: 5px 5px;
      }
      #dot {
        flex: 0 0 auto;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #E8A23C;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 162, 60, 0.55); } 60% { box-shadow: 0 0 0 6px rgba(232, 162, 60, 0); } }
      #label {
        flex: 0 0 auto;
        font: 500 10px/1 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: .18em; text-transform: uppercase; color: rgba(243, 226, 198, 0.5);
      }
      #label:empty { display: none; }
      #text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        /* keep the TAIL of the sentence in view as it grows; what scrolls
           off the start fades rather than being cut */
        direction: rtl;
        text-align: left;
      }
      #text.long { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 28px); }
      #text span { direction: ltr; unicode-bidi: bidi-override; }
      #text.idle span { font: 400 italic 16px/1.4 "Newsreader", Georgia, serif; color: rgba(243, 226, 198, 0.62); }
      @media (prefers-reduced-motion: reduce) { #dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="box">
      <div id="dot"></div>
      <div id="label">Live</div>
      <div id="text" class="idle"><span id="inner">listening…</span></div>
    </div>
    <script src="knobs.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; connect-src https:; font-src 'self'">
<title>Tailzu</title>
<style>
  /* Theme values are overwritten from the server's tokens the moment bootstrap
     lands. These are only what the window paints during the first frame. */
  :root {
    --bg:#000; --card:#0b0b0f; --input:#0e0e12; --border:rgba(255,255,255,.10);
    --text:rgba(255,255,255,.96); --body:rgba(255,255,255,.74); --muted:rgba(255,255,255,.55);
    --label:rgba(255,255,255,.42); --accent:#E8A23C; --danger:#e0556b;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--body);
    font:15px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button { font:inherit; color:inherit; }

  /* ── shell ─────────────────────────────────────────────────────────────── */
  #shell { display:flex; height:100%; }
  #rail {
    width:210px; flex:none; border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; gap:2px;
  }
  .brand { font-size:19px; font-weight:700; color:var(--text); padding:4px 10px 16px; letter-spacing:-.2px; }
  .tab {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:0; border-radius:9px; padding:10px 11px; cursor:pointer;
    color:var(--muted); font-size:14.5px; font-weight:500;
  }
  .tab:hover { background:var(--card); color:var(--text); }
  .tab[aria-current="true"] { background:var(--card); color:var(--accent); }
  .tab:focus-visible, .lnk:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .railfoot { margin-top:auto; display:flex; flex-direction:column; gap:2px; }
  .lnk {
    background:none; border:0; border-radius:9px; padding:9px 11px; text-align:left;
    color:var(--label); font-size:13px; cursor:pointer;
  }
  .lnk:hover { background:var(--card); color:var(--text); }
  .lnk.go { color:var(--accent); }

  /* ── content ───────────────────────────────────────────────────────────── */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #crumb {
    height:46px; flex:none; display:flex; align-items:center; gap:10px;
    padding:0 22px; border-bottom:1px solid var(--border); color:var(--label); font-size:13px;
  }
  #back { background:none; border:0; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:7px; }
  #back:hover { background:var(--card); color:var(--text); }
  #view { flex:1; overflow-y:auto; overflow-x:hidden; }
  .pad { max-width:640px; margin:0 auto; padding:30px 24px 90px; }

  /* ── sign in ───────────────────────────────────────────────────────────── */
  #gate { height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gatebox { width:100%; max-width:352px; }
  .gatebox h1 { font-size:34px; font-weight:700; color:var(--text); margin:0 0 6px; letter-spacing:-.6px; }
  .gatebox p.sub { margin:0 0 26px; color:var(--muted); }
  .field {
    width:100%; background:var(--input); border:1px solid var(--border); border-radius:13px;
    padding:14px 15px; color:var(--text); font-size:16px; outline:none;
  }
  .field:focus { border-color:var(--accent); }
  .cta {
    width:100%; margin-top:10px; background:var(--accent); color:#000; border:0;
    border-radius:13px; padding:14px; font-size:16px; font-weight:700; cursor:pointer;
  }
  .cta[disabled] { opacity:.42; cursor:default; }
  .note { color:var(--label); font-size:13px; margin-top:14px; }
  .err { color:var(--danger); font-size:13.5px; margin-top:12px; min-height:19px; }

  /* method switch — only rendered when the backend has phone sign-in on */
  .methods { display:flex; gap:2px; background:var(--input); border:1px solid var(--border);
             border-radius:11px; padding:3px; margin-bottom:12px; }
  .methods button { flex:1; background:none; border:0; border-radius:8px; padding:9px;
                    color:var(--muted); font-size:14px; font-weight:500; cursor:pointer; }
  .methods button[aria-pressed="true"] { background:var(--card); color:var(--text); }
  .phonerow { display:flex; gap:8px; }
  .phonerow .dial { width:92px; flex:none; text-align:center; }

  /* Apple / Google */
  .or { display:flex; align-items:center; gap:12px; margin:22px 0 14px;
        color:var(--label); font-size:12px; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--border); }
  .oauth { display:flex; flex-direction:column; gap:9px; }
  .oauth button {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; border-radius:13px; padding:13px; font-size:15px; font-weight:600;
    cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text);
  }
  .oauth button:hover { border-color:var(--muted); }
  .oauth button[disabled] { opacity:.45; cursor:default; }
  .oauth svg { display:block; flex:none; }

  /* ── toast ─────────────────────────────────────────────────────────────── */
  #toast {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:11px 16px; color:var(--text); font-size:14px; opacity:0;
    transition:opacity .18s; pointer-events:none; max-width:80%;
  }
  #toast.on { opacity:1; }
  @media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>
</head>
<body>
  <div id="gate" hidden>
    <div class="gatebox">
      <h1>Tailzu</h1>
      <p class="sub">Sign in the same way you do on your phone — your voices, history and words come with you.</p>
      <div id="stepEmail">
        <div class="methods" id="methods" hidden>
          <button data-m="email" aria-pressed="true">Email</button>
          <button data-m="phone" aria-pressed="false">Phone</button>
        </div>
        <input class="field" id="email" type="email" placeholder="you@example.com"
               autocomplete="email" autocapitalize="none" spellcheck="false">
        <div class="phonerow" id="phoneRow" hidden>
          <input class="field dial" id="dial" value="+1" inputmode="tel" maxlength="5" aria-label="Country code">
          <input class="field" id="phone" type="tel" placeholder="555 000 1234"
                 autocomplete="tel" inputmode="tel" spellcheck="false">
        </div>
        <button class="cta" id="sendCode">Send code</button>

        <div class="or">or</div>
        <div class="oauth">
          <button id="appleBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.46 1.58-1.51 3.14-.9 1.36-1.84 2.71-3.32 2.71-1.48 0-1.86-.88-3.56-.88-1.66 0-2.25.91-3.6.91-1.36 0-2.3-1.27-3.22-2.61-1.87-2.61-3.34-7.53-1.42-10.86.95-1.66 2.65-2.7 4.5-2.73 1.4-.03 2.72.95 3.58.95.85 0 2.45-1.18 4.12-1.01.7.03 2.67.28 3.93 2.13-.1.06-2.35 1.37-2.33 4.07.03 3.22 2.83 4.29 2.86 4.31z"/></svg>
            Continue with Apple
          </button>
          <button id="googleBtn">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
          </button>
        </div>
      </div>
      <div id="stepCode" hidden>
        <input class="field" id="code" inputmode="numeric" placeholder="6-digit code" maxlength="6" autocomplete="one-time-code">
        <button class="cta" id="verify">Sign in</button>
        <button class="lnk" id="backToEmail" style="margin-top:8px;padding-left:0">Start over</button>
      </div>
      <div class="err" id="gateErr"></div>
      <p class="note">Dictation works from the tray without signing in. Everything that is yours — stats, history, the voices you made — needs an account.</p>
    </div>
  </div>

  <div id="shell" hidden>
    <nav id="rail">
      <div class="brand">Tailzu</div>
      <div id="tabs"></div>
      <div class="railfoot">
        <button class="lnk go" id="dictate">Dictate now</button>
        <button class="lnk" id="settingsLink">Settings</button>
        <button class="lnk" id="signOut">Sign out</button>
      </div>
    </nav>
    <div id="main">
      <div id="crumb"><button id="back" hidden>← Back</button><span id="title"></span></div>
      <div id="view"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="sdui.js"></script>
</body>
</html>

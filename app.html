<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- connect-src names wss: as well: "https:" alone refused the Train tab's
     voice socket. localhost is for a dev backend (main.js refuses any other
     plain-http address). base-uri and form-action: markup that got into a
     page could otherwise re-point every relative URL, or post a form away. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; connect-src https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; font-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>Tailzu</title>
<style>
  /* THE DESK'S FACES, shipped with the app: this window's policy lets it load
     fonts from its own files and nowhere else. Newsreader for what is
     written, Caveat for what is said, IBM Plex Mono for labels, Instrument
     Sans for the controls, Noto for Devanagari. (assets/fonts/OFL.txt) */
  @font-face { font-family:"Newsreader"; font-weight:300; font-style:normal; font-display:swap; src:url(assets/fonts/newsreader-latin-300-normal.woff2) format("woff2"); }
  @font-face { font-family:"Newsreader"; font-weight:400; font-style:normal; font-display:swap; src:url(assets/fonts/newsreader-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Newsreader"; font-weight:300; font-style:italic; font-display:swap; src:url(assets/fonts/newsreader-latin-300-italic.woff2) format("woff2"); }
  @font-face { font-family:"Newsreader"; font-weight:400; font-style:italic; font-display:swap; src:url(assets/fonts/newsreader-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family:"Caveat"; font-weight:600; font-display:swap; src:url(assets/fonts/caveat-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-weight:500; font-display:swap; src:url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family:"Instrument Sans"; font-weight:400; font-display:swap; src:url(assets/fonts/instrument-sans-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Instrument Sans"; font-weight:500; font-display:swap; src:url(assets/fonts/instrument-sans-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family:"Instrument Sans"; font-weight:600; font-display:swap; src:url(assets/fonts/instrument-sans-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"Noto Sans Devanagari"; font-weight:100 900; font-display:swap; src:url(assets/fonts/noto-sans-devanagari-devanagari-400-normal.woff2) format("woff2"); unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF; }

  /* THE DESK'S TOKENS. Paper and ink in light, ink and pale in dark, the
     site's own rooms for colour. The server can retune any of these
     (desktop.look); these are the first frame's. */
  :root {
    --d-ground:#FBF8F2; --d-sheet:#FFFFFF; --d-ink:#1B1712; --d-ink2:#6B6258; --d-ink3:#A69D91;
    --d-rule:rgba(27,23,18,.12); --d-press:rgba(27,23,18,.06); --d-typed:#E4587B;
    --d-violet:#1C1640; --d-violet-hi:#2A2266; --d-pale:#F3E2C6; --d-key:#2A241F;
    --f-written:"Newsreader","Iowan Old Style",Georgia,serif;
    --f-said:"Caveat","Segoe Print",cursive;
    --f-label:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --f-ui:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --f-deva:"Noto Sans Devanagari","Nirmala UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --d-ground:#0F0D0B; --d-sheet:#151210; --d-ink:#F3E2C6; --d-ink2:rgba(243,226,198,.66); --d-ink3:rgba(243,226,198,.42);
      --d-rule:rgba(243,226,198,.12); --d-press:rgba(243,226,198,.07);
    }
  }

  /* Theme values are overwritten from the server's tokens the moment bootstrap
     lands. These are only what the window paints during the first frame. */
  :root {
    --bg:#000; --card:#0b0b0f; --input:#0e0e12; --border:rgba(255,255,255,.10);
    --text:rgba(255,255,255,.96); --body:rgba(255,255,255,.74); --muted:rgba(255,255,255,.55);
    --label:rgba(255,255,255,.42); --accent:#FFFFFF; --danger:#e0556b;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--body);
  }
  /* The desk's ground from the first frame, when this window was a desk last
     time (sdui.js rememberedLook) — never black, then white. */
  html[data-look="desk"] body { background:var(--d-sheet); }
  body {
    font:15px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button { font:inherit; color:inherit; }

  /* ── shell ─────────────────────────────────────────────────────────────── */
  /* The gate and the shell are both flex boxes by id, and an id outranks
     the browser's own [hidden] rule — so `hidden` alone left the empty
     gate standing at full height and pushed the signed-in shell below the
     window, where overflow:hidden on the body swallowed it. */
  #gate[hidden], #shell[hidden] { display:none; }
  #shell { display:flex; height:100%; }
  #rail {
    width:210px; flex:none; border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; gap:2px;
  }
  .brand { font-size:19px; font-weight:700; color:var(--text); padding:4px 10px 16px; letter-spacing:-.2px; }
  .tab {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:0; border-radius:9px; padding:10px 11px; cursor:pointer;
    color:var(--muted); font-size:14.5px; font-weight:500;
  }
  .tab:hover { background:var(--card); color:var(--text); }
  .tab[aria-current="true"] { background:var(--card); color:var(--accent); }
  .tab:focus-visible, .lnk:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .railfoot { margin-top:auto; display:flex; flex-direction:column; gap:2px; }
  .lnk {
    background:none; border:0; border-radius:9px; padding:9px 11px; text-align:left;
    color:var(--label); font-size:13px; cursor:pointer;
  }
  .lnk:hover { background:var(--card); color:var(--text); }
  .lnk.go { color:var(--accent); }

  /* ── the desk: a masthead over the page ─────────────────────────────────── */
  #mast { display:none; }
  #shell[data-look="desk"] { flex-direction:column; background:var(--d-sheet); color:var(--d-ink); }
  #shell[data-look="desk"] #rail { display:none; }
  /* Three columns: the name, the tabs, the account. The outer two share the
     leftover width equally, so the tabs sit in the middle of the window; the
     tab column may shrink to nothing and scroll in a narrow one. Sizes and
     the tabs' side come from the server (desktop.mast, sdui.js applyMast). */
  #shell[data-look="desk"] #mast {
    display:grid; grid-template-columns:1fr minmax(0, max-content) 1fr; align-items:center; column-gap:26px;
    height:60px; flex:none; padding:0 26px;
    border-bottom:1px solid var(--d-rule); background:var(--d-sheet);
  }
  #shell[data-look="desk"] #mast[data-tabs="start"] { grid-template-columns:max-content minmax(0, 1fr) max-content; }
  #shell[data-look="desk"][data-chrome="0"] #mast { display:none; }
  #mast .brand2 { display:flex; align-items:center; gap:8px; color:var(--d-ink); justify-self:start; }
  #mast .brand2 svg { width:var(--m-logo, 19px); height:auto; }
  #mast .brand2 b { font:400 var(--m-brand, 18px)/1 var(--f-written); letter-spacing:-.01em; }
  #mtabs { display:flex; gap:2px; overflow-x:auto; justify-self:center; max-width:100%; }
  #mast[data-tabs="start"] #mtabs { justify-self:start; }
  .mtab { border:0; background:none; padding:9px 11px; font:500 11.5px/1 var(--f-label); letter-spacing:.14em;
          text-transform:uppercase; color:var(--d-ink2); cursor:pointer; white-space:nowrap; }
  .mtab:hover { color:var(--d-ink); }
  .mtab[aria-current="true"] { color:var(--d-ink); box-shadow:inset 0 -2px 0 var(--d-ink); }
  #mast .mright { justify-self:end; display:flex; align-items:center; gap:16px; }
  #quota { display:grid; gap:5px; border:0; background:none; padding:0; cursor:pointer; text-align:right;
           font:500 11px/1 var(--f-label); letter-spacing:.08em; text-transform:uppercase; color:var(--d-ink2); --fill:0%; }
  #quota i { display:block; width:120px; height:3px; background:var(--d-press); position:relative; }
  #quota i::after { content:""; position:absolute; left:0; top:0; bottom:0; width:var(--fill); background:var(--d-ink); }
  #gear { width:32px; height:32px; border:0; background:none; border-radius:6px; display:grid; place-items:center; color:var(--d-ink2); cursor:pointer; }
  #gear:hover { color:var(--d-ink); background:var(--d-press); }
  #gear svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
  #me { width:28px; height:28px; border-radius:6px; background:var(--d-ink); color:var(--d-sheet); display:grid; place-items:center; font:400 14px/1 var(--f-written); }
  #shell[data-look="desk"] #crumb { border-bottom:1px solid var(--d-rule); background:var(--d-sheet); color:var(--d-ink3); font:500 11px/1 var(--f-label); letter-spacing:.12em; text-transform:uppercase; }
  #shell[data-look="desk"] #back { color:var(--d-ink); font:500 11px/1 var(--f-label); letter-spacing:.12em; text-transform:uppercase; }
  #shell[data-look="desk"] #back:hover { background:var(--d-press); }
  #shell[data-look="desk"] #crumb:has(#back[hidden]) { display:none; }
  #view[data-look="desk"] { background:var(--d-sheet); color:var(--d-ink); font-family:var(--f-ui); }
  #view[data-look="legacy"] { background:var(--bg); }

  /* The desk's named styles. The server composes pages from these by name
     (props.cls); only d- names are honoured. */
  .d-screen { min-height:100%; }
  .d-page { max-width:980px; width:100%; margin:0 auto; padding:36px 40px 64px; }
  .d-room { background:radial-gradient(90% 140% at 80% 0%, var(--d-violet-hi), var(--d-violet) 70%); color:var(--d-pale); }
  .d-room-inner { max-width:980px; width:100%; margin:0 auto; padding:30px 40px 28px; }
  .d-eyebrow { font:500 11px/1.2 var(--f-label); letter-spacing:.16em; text-transform:uppercase; color:var(--d-ink2); }
  .d-room .d-eyebrow, .d-on-room { color:rgba(243,226,198,.66); }
  .d-h1 { font:300 40px/1.1 var(--f-written); letter-spacing:-.02em; color:inherit; text-wrap:balance; }
  .d-h2 { font:400 24px/1.2 var(--f-written); letter-spacing:-.01em; }
  .d-statement { font:300 34px/1.25 var(--f-written); letter-spacing:-.02em; max-width:30ch; text-wrap:balance; }
  .d-typed { color:var(--d-typed); }
  .d-em { font-style:italic; }
  .d-lede { color:var(--d-ink2); font:400 14px/1.55 var(--f-ui); max-width:60ch; }
  .d-count { font:500 11.5px/1.2 var(--f-label); letter-spacing:.14em; text-transform:uppercase; }
  .d-said { font:600 19px/1.3 var(--f-said); color:var(--d-ink3); white-space:pre-line; font-synthesis:none; }
  .d-written { font:400 19px/1.45 var(--f-written); color:var(--d-ink); white-space:pre-line; }
  .d-deva { font-family:var(--f-deva); font-size:17px; }
  .d-margin { font:500 11px/1.5 var(--f-label); letter-spacing:.08em; text-transform:uppercase; color:var(--d-ink3); }
  .d-margin-strong { font:500 11px/1.5 var(--f-label); letter-spacing:.08em; color:var(--d-ink2); }
  .d-entry { border-top:1px solid var(--d-rule); }
  .d-entry:first-child { border-top:0; }
  .d-tools { opacity:0; transition:opacity .12s; }
  .d-entry:hover .d-tools, .d-entry:focus-within .d-tools { opacity:1; }
  .d-link { border:0; background:none; padding:0; cursor:pointer; font:500 11.5px/1 var(--f-label); letter-spacing:.12em;
            text-transform:uppercase; color:var(--d-ink); text-decoration:underline; text-underline-offset:5px; text-decoration-color:var(--d-ink3); }
  .d-link:hover { text-decoration-color:var(--d-ink); }
  .d-link-danger { color:var(--d-typed); }
  .d-btn { border:0; border-radius:8px; padding:11px 18px; cursor:pointer; font:500 11.5px/1 var(--f-label); letter-spacing:.14em;
           text-transform:uppercase; background:var(--d-ink); color:var(--d-sheet); }
  .d-btn:hover { opacity:.88; }
  .d-keys { display:inline-flex; gap:8px; align-items:center; }
  .d-keycap { display:inline-grid; place-items:center; min-width:58px; height:46px; padding:0 12px; border-radius:9px;
              background:linear-gradient(#332C26, var(--d-key)); color:#F3E2C6; font:500 15px/1 var(--f-ui);
              box-shadow:0 3px 0 #15110E, 0 8px 18px rgba(0,0,0,.25); }
  .d-keys-small .d-keycap { min-width:0; height:26px; padding:0 8px; font-size:12px; border-radius:6px; box-shadow:0 2px 0 #15110E; }
  .d-lane-t { height:6px; background:var(--d-press); position:relative; }
  .d-lane-said { background:var(--d-ink); }
  .d-lane-typed { background:var(--d-typed); }
  .d-lane-label { font:500 11px/1 var(--f-label); letter-spacing:.1em; text-transform:uppercase; }
  .d-sq { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--d-ink3); flex:none; }
  .d-sq-on { background:var(--d-ink); border-color:var(--d-ink); }
  .d-sq-now { border-color:var(--d-ink); border-style:dashed; }
  .d-rule-top { border-top:1px solid var(--d-rule); }
  .d-rule-bottom { border-bottom:1px solid var(--d-rule); }
  .d-spec { font-family:var(--f-written); font-weight:300; letter-spacing:-.02em; line-height:1; }
  .d-num { font:500 12px/1 var(--f-label); letter-spacing:.1em; color:var(--d-ink2); font-variant-numeric:tabular-nums; }
  .d-bar1 { height:1px; background:var(--d-rule); position:relative; }
  .d-bar1-fill { position:absolute; left:0; top:-2px; height:5px; background:var(--d-ink); }
  .d-fix { position:relative; display:inline-block; font:400 22px/1.2 var(--f-written); padding-top:18px; }
  .d-was { position:absolute; left:0; top:-2px; font:600 17px/1 var(--f-said); color:var(--d-ink3); white-space:nowrap; }
  .d-was::after { content:""; position:absolute; left:-3px; right:-3px; top:50%; height:2px; background:var(--d-typed); transform:rotate(-3deg); border-radius:2px; }
  .d-say { font:600 20px/1.2 var(--f-said); color:var(--d-ink2); }
  .d-get { font:400 16px/1.45 var(--f-written); white-space:pre-line; }
  .d-input { flex:1; min-width:0; border:0; border-bottom:1px solid var(--d-ink); background:none; font:400 19px/1.3 var(--f-written);
             color:var(--d-ink); padding:6px 0; outline:none; }
  .d-input::placeholder { color:var(--d-ink3); }
  .d-seg { display:inline-flex; border:1px solid var(--d-rule); border-radius:8px; padding:3px; flex-wrap:wrap; }
  .d-seg-item { border:0; background:none; border-radius:5px; padding:8px 14px; cursor:pointer; font:500 11px/1 var(--f-label);
                letter-spacing:.14em; text-transform:uppercase; color:var(--d-ink2); }
  .d-seg-on { background:var(--d-ink); color:var(--d-sheet); }
  .d-world { position:relative; border-radius:12px; padding:22px 20px 20px; min-height:230px; overflow:hidden; cursor:pointer; flex:1; min-width:0; }
  .d-world-on { outline:2px solid var(--d-ink); outline-offset:3px; }
  .d-world-name { font:500 10.5px/1 var(--f-label); letter-spacing:.16em; text-transform:uppercase; opacity:.72; }
  .d-world-text { font-size:19px; line-height:1.4; white-space:pre-line; }
  .d-world-use { font:500 10.5px/1 var(--f-label); letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
  .d-w-zu { background:#F3EDE2; color:#1B1712; } .d-w-zu .d-world-text { font-family:var(--f-written); }
  .d-w-indigo { background:linear-gradient(160deg,#2A2878,#17163F); color:#F3E2C6; } .d-w-indigo .d-world-text { font-family:var(--f-written); }
  .d-w-saffron { background:linear-gradient(160deg,#F7B843,#E0870E); color:#1B1712; } .d-w-saffron .d-world-text { font-family:var(--f-ui); font-weight:500; }
  .d-w-teal { background:linear-gradient(160deg,#167D71,#0C4F47); color:#F3E2C6; } .d-w-teal .d-world-text { font:600 24px/1.3 var(--f-said); }
  .d-w-paper { background:#FBF8F2; color:#1B1712; box-shadow:inset 0 0 0 1px rgba(27,23,18,.1); } .d-w-paper .d-world-text { font-family:var(--f-written); font-style:italic; }
  .d-w-paper::before, .d-w-paper::after { content:""; position:absolute; left:20px; right:20px; height:1px; background:rgba(27,23,18,.25); }
  .d-w-paper::before { top:48px; } .d-w-paper::after { bottom:42px; }
  .d-w-noir { background:#0B0B0B; color:#EDEDED; } .d-w-noir .d-world-text { font-family:var(--f-written); font-style:italic; }
  .d-w-noir::before { content:""; position:absolute; inset:-40%; background:repeating-linear-gradient(-20deg,rgba(255,255,255,.05) 0 14px,transparent 14px 34px); pointer-events:none; }
  .d-w-night { background:#050505; color:#fff; } .d-w-night .d-world-text { font:300 16px/1.5 var(--f-written); letter-spacing:.12em; text-transform:uppercase; }
  .d-w-rose { background:linear-gradient(160deg,#E4587B,#B83A5C); color:#FFF4F6; } .d-w-rose .d-world-text { font-family:var(--f-written); font-style:italic; }
  .d-switch { width:38px; height:22px; border-radius:99px; border:1.5px solid var(--d-ink); background:none; position:relative; padding:0; cursor:pointer; flex:none; }
  .d-switch::after { content:""; position:absolute; top:3px; left:3px; width:13px; height:13px; border-radius:3px; background:var(--d-ink); transition:transform .15s; }
  .d-switch[aria-checked="true"] { background:var(--d-ink); }
  .d-switch[aria-checked="true"]::after { transform:translateX(16px); background:var(--d-sheet); }
  .d-k { font:600 14px/1.4 var(--f-ui); }
  .d-v { font:400 17px/1.35 var(--f-written); }
  .d-plan { border:1px solid var(--d-rule); border-radius:10px; padding:18px; flex:1; min-width:0; }
  .d-plan-lead { border-color:var(--d-ink); }
  .d-price { font:300 32px/1.1 var(--f-written); font-variant-numeric:tabular-nums; }
  .d-sticky { position:sticky; top:0; }
  .d-link:focus-visible, .d-btn:focus-visible, .d-seg-item:focus-visible, .d-world:focus-visible, .d-switch:focus-visible, .mtab:focus-visible,
  #gear:focus-visible, #quota:focus-visible { outline:2px solid var(--d-ink); outline-offset:2px; }
  @media (max-width: 860px) { .d-page, .d-room-inner { padding-left:22px; padding-right:22px; } .d-wrap-narrow { flex-direction:column !important; } }
  @media (prefers-reduced-motion: reduce) { .d-tools, .d-switch::after { transition:none; } }

  /* ── content ───────────────────────────────────────────────────────────── */
  /* Positioned so the neural field, which is a layer rather than a node in
     the flow, has something to measure against. */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
  #crumb {
    height:46px; flex:none; display:flex; align-items:center; gap:10px;
    padding:0 22px; border-bottom:1px solid var(--border); color:var(--label); font-size:13px;
  }
  #back { background:none; border:0; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:7px; }
  #back:hover { background:var(--card); color:var(--text); }
  #view { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; z-index:1; }
  /* A screen that said hideChrome owns the window: no rail, no crumb, no
     scroll, and a flex column so a root asking for flex:1 can actually fill
     something. [hidden] alone cannot hide the rail — its own display:flex
     outranks it — which is why this is an attribute and not a property. */
  #shell[data-chrome="0"] #rail { display:none; }
  #crumb[hidden] { display:none; }
  #view[data-full="1"] { overflow:hidden auto; display:flex; flex-direction:column; }
  /* …and still scrolls when the window is shorter than the screen: at 150%
     scaling a 1080p laptop gives a window 672 points, and a screen that owned
     the window clipped whatever did not fit, with no way to reach it. */
  #view[data-full="1"] > :first-child { flex:none; min-height:100%; }
  /* A root that asks for flex:1 gets a column to grow in, and grows past the
     window when its content does — the view still scrolls. */
  #view[data-flex="1"] { display:flex; flex-direction:column; }
  #view[data-flex="1"] > :first-child { min-height:100%; }
  .pad { max-width:640px; margin:0 auto; padding:30px 24px 90px; }

  /* ── sign in ───────────────────────────────────────────────────────────── */
  /* THE ART IS A COMPOSITION, NOT A TEXTURE.
     The mark and the headline are PLACED in it, and a form centred in the
     window lands on top of both. A phone never has that problem — the art is a
     backdrop behind one column — but a window is wide enough for the two to
     stand beside each other, and wide enough for them to collide.
     Where the form goes is decided by the server (desktop.shell.gateLayout),
     because the art is an upload: a new one with its subject on the right is a
     number to change and a cache bump, not an installer. These are only the
     values the first frame paints with. */
  #gate {
    position:relative; height:100%; display:flex; align-items:center;
    justify-content:center; padding:24px;
    --gate-col:50%;              /* the form column's centre, across the window */
  }
  /* The sign-in art, the same upload the phones show. It sits UNDER the box and
     takes no clicks, so a field is never covered by a decoration. */
  #gatebg { position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  #gatebg > img, #gatebg > video { width:100%; height:100%; object-fit:cover; display:block; }
  /* Darkening under the FORM, not over the whole picture. The old scrim ran
     top-to-bottom at 88% by the foot, which is right for art that is a texture
     and wrong for art that has a headline in it: it crushed the part the art
     was composed around. */
  #gatebg::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.72) 55%, rgba(0,0,0,.88) 100%);
  }
  /* Two columns: the darkening moves under the form and off the picture. */
  #gatebg[data-scrim="1"]::after { background:var(--gate-scrim); }
  .gatebox { position:relative; z-index:1; width:100%; max-width:352px; }
  /* Two columns. The box is placed by its own centre, so one number from the
     server positions it whatever the window is doing. */
  #gate[data-cols="1"] { justify-content:flex-start; }
  #gate[data-cols="1"] .gatebox {
    max-width:var(--gate-w, 300px);
    margin-left:calc(var(--gate-col) - var(--gate-w, 300px) / 2);
  }
  .gatebox h1 { font-size:34px; font-weight:700; color:var(--text); margin:0 0 6px; letter-spacing:-.6px; }
  .gatebox p.sub { margin:0 0 26px; color:var(--muted); }
  .note { color:var(--label); font-size:13px; margin-top:14px; }
  .err { color:var(--danger); font-size:13.5px; margin-top:12px; min-height:19px; }

  /* ── toast ─────────────────────────────────────────────────────────────── */
  #toast {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:11px 16px; color:var(--text); font-size:14px; opacity:0;
    transition:opacity .18s; pointer-events:none; max-width:80%;
  }
  #toast.on { opacity:1; }
  @media (prefers-reduced-motion:reduce){ #toast{transition:none} }

    /* ---- nodes the window learned to draw ------------------------------- */
    /* A sheet over the screen, dimmed behind, the same shape the phones use
       for the voice editor. Centred rather than bottom-anchored: a window has
       no thumb reach to respect. */
    .tz-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
      justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
    .tz-sheet{width:min(520px,92vw);max-height:86vh;overflow:auto;border-radius:18px;
      background:var(--card,#141418);border:1px solid var(--border);padding:22px}
    /* The field. An iframe because the page it draws is HTML and canvas, and
       this is a browser — it needs no bridge and no stand-in. */
    .tz-field{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    /* An indeterminate bar, for a screen that is waiting on something. */
    @keyframes tz-indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
    .tz-indet{width:33%;animation:tz-indet 1.1s ease-in-out infinite}
    .tz-press{transition:opacity .12s}
    /* A screen's first paint eases in over whatever was there; the field under
       it does not move. Off under reduced motion. */
    @keyframes tz-swap{from{opacity:0}to{opacity:1}}
    .tz-swap{animation:tz-swap .3s ease-out both}
    @media (prefers-reduced-motion:reduce){ .tz-swap{animation:none} }
    .tz-press:active{opacity:.82}

    /* ---- the sign-in screen --------------------------------------------- */
    /* Drawn from the server's auth.screen, the same tree the phones render.
       Everything that decides how it LOOKS is a prop on that tree; these are
       only the mechanics a browser needs to make the shapes work. */
    /* A row flying in. The phones spring it; this is the same delay, travel
       and overshoot, as a keyframe. Held at its start until the delay is up,
       or five rows flash at full size and then fly. */
    @keyframes tz-rise{
      from{opacity:0;transform:translateY(var(--rise-y,100px)) scale(var(--rise-s,.86))}
      60%{opacity:1;transform:translateY(-6px) scale(1.012)}
      to{opacity:1;transform:none}
    }
    .tz-rise{animation:tz-rise .78s cubic-bezier(.19,1,.22,1) both}
    @media (prefers-reduced-motion:reduce){ .tz-rise{animation:none} }
    /* A repaint WITHIN a phase must not fly the rows in again. The screen is
       repainted on every keystroke — there is one description of what it looks
       like, rather than a set of imperative edits that have to agree — so the
       entrance is a property of arriving at a phase, not of being painted. */
    #gateForm[data-still="1"] .tz-rise{animation:none}

    /* The pill: one method, and the pill IS the field. */
    .tz-pill{position:relative;display:flex;align-items:center;width:100%;overflow:hidden}
    .tz-pillin{
      flex:1;min-width:0;height:100%;background:none;border:0;outline:none;
      font:inherit;color:var(--text);
    }
    .tz-pillin::placeholder{color:rgba(255,255,255,.32)}
    .tz-dial{
      position:absolute;left:5px;width:72px;height:calc(100% - 10px);border-radius:999px;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
      color:var(--text);font:inherit;font-size:14px;text-align:center;outline:none;
    }
    /* The disc. It sits left as a badge and moves to the right end, in the
       brand's dimmer amber, once there is something to send — which is the
       phone's gesture stated as a position rather than a drag. */
    .tz-disc{
      position:absolute;top:50%;transform:translateY(-50%);
      display:flex;align-items:center;justify-content:center;
      border-radius:50%;border:1px solid transparent;
      transition:left .34s cubic-bezier(.19,1,.22,1),right .34s cubic-bezier(.19,1,.22,1),
                 background .2s,opacity .12s;
    }
    .tz-disc:active{opacity:.82}
    .tz-disc.tz-busy{opacity:.5;pointer-events:none}
    .tz-disc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){ .tz-disc{transition:none} }

    /* A wrong code, said without words. */
    @keyframes tz-shake{
      0%,100%{transform:translateX(0)} 20%{transform:translateX(8px)}
      45%{transform:translateX(-8px)} 70%{transform:translateX(4px)}
    }
    .tz-shake{animation:tz-shake .26s}

    .tz-social{
      display:flex;align-items:center;justify-content:center;flex:none;
      border-radius:50%;cursor:pointer;
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
    }
    .tz-social:hover{border-color:rgba(255,255,255,.3)}
    .tz-social[disabled]{opacity:.45;cursor:default}
  </style>
</head>
<body>
  <div id="gate" hidden>
    <div id="gatebg" aria-hidden="true"></div>
    <div class="gatebox">
      <!-- SERVER-DRAWN. This used to be the screen: tabs, two fields, a big
           amber button and two wide social rows, all written here — while the
           phones rendered `auth.screen` from the boot flags. So the first
           screen of the product was the one screen that looked like a
           different product, and the only one whose arrangement still needed
           an installer to change. The same tree paints into #gateForm now.

           The heading, the note and the error line stay markup: the first two
           are copy the server fills in (desktop.shell.gate), and the third has
           to be able to say "couldn't reach the backend" on a launch where no
           tree ever arrived. -->
      <h1 id="gateTitle">Tailzu</h1>
      <p class="sub" id="gateSub">Sign in the same way you do on your phone — your voices, history and words come with you.</p>
      <div id="gateForm"></div>
      <div class="err" id="gateErr"></div>
      <!-- Empty unless the server sends a line. The form asks for the account;
           it does not need a sentence underneath saying that it does. -->
      <p class="note" id="gateNote" hidden></p>
    </div>
  </div>

  <div id="shell" hidden>
    <!-- THE DESK'S MASTHEAD. Shown instead of the rail when the server sends
         desk pages (desktop.desk); the tabs are the server's navigation. -->
    <header id="mast">
      <div class="brand2">
        <svg viewBox="170 228 680 512" aria-hidden="true"><line x1="346" y1="402" x2="270" y2="598" stroke="#C9B08C" stroke-width="22" stroke-linecap="round"/><line x1="668" y1="478" x2="828" y2="243" stroke="#C77A3A" stroke-width="22" stroke-linecap="round"/><line x1="444" y1="394" x2="554" y2="486" stroke="#E8A23C" stroke-width="36" stroke-dasharray="11 13"/><rect x="308" y="269" width="132" height="132" rx="28" fill="currentColor"/><rect x="558" y="478" width="132" height="132" rx="28" fill="currentColor"/><rect x="178" y="598" width="132" height="132" rx="28" fill="currentColor"/></svg>
        <b id="mastBrand">Tailzu</b>
      </div>
      <nav id="mtabs" aria-label="Pages"></nav>
      <div class="mright">
        <button id="quota" type="button"><span></span><i></i></button>
        <button id="gear" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
        <span id="me" aria-hidden="true"></span>
      </div>
    </header>
    <nav id="rail">
      <div class="brand" id="railBrand">Tailzu</div>
      <div id="tabs"></div>
      <div class="railfoot">
        <button class="lnk go" id="dictate">Dictate now</button>
        <button class="lnk" id="settingsLink">Settings</button>
        <button class="lnk" id="signOut">Sign out</button>
      </div>
    </nav>
    <div id="main">
      <div id="crumb"><button id="back" hidden>← Back</button><span id="title"></span></div>
      <div id="view"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- The server's knobs, before the renderer that reads them. The words in
       the markup above are only the first frame's: sdui.js replaces each with
       its label (desktop.gate.*, desktop.rail.*) as soon as knobs are known. -->
  <script src="knobs.js"></script>
  <script src="sdui.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; connect-src https:; font-src 'self'">
<title>Tailzu</title>
<style>
  /* Theme values are overwritten from the server's tokens the moment bootstrap
     lands. These are only what the window paints during the first frame. */
  :root {
    --bg:#000; --card:#0b0b0f; --input:#0e0e12; --border:rgba(255,255,255,.10);
    --text:rgba(255,255,255,.96); --body:rgba(255,255,255,.74); --muted:rgba(255,255,255,.55);
    --label:rgba(255,255,255,.42); --accent:#E8A23C; --danger:#e0556b;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--body);
    font:15px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button { font:inherit; color:inherit; }

  /* ── shell ─────────────────────────────────────────────────────────────── */
  #shell { display:flex; height:100%; }
  #rail {
    width:210px; flex:none; border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; gap:2px;
  }
  .brand { font-size:19px; font-weight:700; color:var(--text); padding:4px 10px 16px; letter-spacing:-.2px; }
  .tab {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:0; border-radius:9px; padding:10px 11px; cursor:pointer;
    color:var(--muted); font-size:14.5px; font-weight:500;
  }
  .tab:hover { background:var(--card); color:var(--text); }
  .tab[aria-current="true"] { background:var(--card); color:var(--accent); }
  .tab:focus-visible, .lnk:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .railfoot { margin-top:auto; display:flex; flex-direction:column; gap:2px; }
  .lnk {
    background:none; border:0; border-radius:9px; padding:9px 11px; text-align:left;
    color:var(--label); font-size:13px; cursor:pointer;
  }
  .lnk:hover { background:var(--card); color:var(--text); }
  .lnk.go { color:var(--accent); }

  /* ── content ───────────────────────────────────────────────────────────── */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #crumb {
    height:46px; flex:none; display:flex; align-items:center; gap:10px;
    padding:0 22px; border-bottom:1px solid var(--border); color:var(--label); font-size:13px;
  }
  #back { background:none; border:0; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:7px; }
  #back:hover { background:var(--card); color:var(--text); }
  #view { flex:1; overflow-y:auto; overflow-x:hidden; }
  .pad { max-width:640px; margin:0 auto; padding:30px 24px 90px; }

  /* ── sign in ───────────────────────────────────────────────────────────── */
  #gate { height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gatebox { width:100%; max-width:352px; }
  .gatebox h1 { font-size:34px; font-weight:700; color:var(--text); margin:0 0 6px; letter-spacing:-.6px; }
  .gatebox p.sub { margin:0 0 26px; color:var(--muted); }
  .field {
    width:100%; background:var(--input); border:1px solid var(--border); border-radius:13px;
    padding:14px 15px; color:var(--text); font-size:16px; outline:none;
  }
  .field:focus { border-color:var(--accent); }
  .cta {
    width:100%; margin-top:10px; background:var(--accent); color:#000; border:0;
    border-radius:13px; padding:14px; font-size:16px; font-weight:700; cursor:pointer;
  }
  .cta[disabled] { opacity:.42; cursor:default; }
  .note { color:var(--label); font-size:13px; margin-top:14px; }
  .err { color:var(--danger); font-size:13.5px; margin-top:12px; min-height:19px; }

  /* ── toast ─────────────────────────────────────────────────────────────── */
  #toast {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:11px 16px; color:var(--text); font-size:14px; opacity:0;
    transition:opacity .18s; pointer-events:none; max-width:80%;
  }
  #toast.on { opacity:1; }
  @media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>
</head>
<body>
  <div id="gate" hidden>
    <div class="gatebox">
      <h1>Tailzu</h1>
      <p class="sub">Sign in with the same address you use on your phone — your voices, history and words come with you.</p>
      <div id="stepEmail">
        <input class="field" id="email" type="email" placeholder="you@example.com"
               autocomplete="email" autocapitalize="none" spellcheck="false">
        <button class="cta" id="sendCode">Send code</button>
      </div>
      <div id="stepCode" hidden>
        <input class="field" id="code" inputmode="numeric" placeholder="6-digit code" maxlength="6" autocomplete="one-time-code">
        <button class="cta" id="verify">Sign in</button>
        <button class="lnk" id="backToEmail" style="margin-top:8px;padding-left:0">Use a different address</button>
      </div>
      <div class="err" id="gateErr"></div>
      <p class="note">Dictation works from the tray without signing in. Everything that is yours — stats, history, the voices you made — needs an account.</p>
    </div>
  </div>

  <div id="shell" hidden>
    <nav id="rail">
      <div class="brand">Tailzu</div>
      <div id="tabs"></div>
      <div class="railfoot">
        <button class="lnk go" id="dictate">Dictate now</button>
        <button class="lnk" id="settingsLink">Settings</button>
        <button class="lnk" id="signOut">Sign out</button>
      </div>
    </nav>
    <div id="main">
      <div id="crumb"><button id="back" hidden>← Back</button><span id="title"></span></div>
      <div id="view"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="sdui.js"></script>
</body>
</html>
